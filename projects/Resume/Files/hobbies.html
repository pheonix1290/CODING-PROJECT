<!DOCTYPE html>
 <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Hobbies</title>
                                               <!--CSS content-->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2f4f6f;
            text-align: center;
        }

        p {
            text-align: center;
        }

        ul {
            padding: 20px 30px;
        }

        li {
            margin-bottom: 12px;
        }

        li:hover {
            color: #4a6fa5;
        }

        hr {
            border: 0;
            border-top: 1px solid #d9e2ec;
            margin-top: 25px;
        }
    </style>

    </head>
    <body>
        <main>
        <h1>My Hobbies</h1>
        <ul>
            <li>charcoal art</li>
            <li>reading</li>
            <li>cooking</li>
            <li>binge-watching TV shows</li>
            <li>playing video games</li>
        </ul>
            <hr/>
        </main>
    </body>
 </html>
